version: 1
defaults: {hysteresis_pct: 2.0, persistence: 3}
limits:
  cabin_pressure_kpa:
    checks:
      - {type: limit, red_low: 95.0, yellow_low: 98.0, yellow_high: 104.0, red_high: 106.0, hysteresis_pct: 15}
      - {type: roc, limit_per_s: 0.15, window_s: 1.0, direction: falling, severity: YELLOW}
  cabin_temp_c: {checks: [{type: limit, red_low: 15.0, yellow_low: 18.0, yellow_high: 26.5, red_high: 30.0, hysteresis_pct: 3}]}
  bus_voltage_v: {checks: [{type: limit, red_low: 24.0, yellow_low: 26.0, yellow_high: 30.0, red_high: 32.0, hysteresis_pct: 6}]}
  bus_current_a: {checks: [{type: limit, yellow_high: 8.0, red_high: 10.0, hysteresis_abs: 0.2}]}
  tank_pressure_bar: {checks: [{type: limit, red_low: 15.0, yellow_low: 17.0, yellow_high: 23.0, red_high: 25.0, hysteresis_pct: 4}]}
  rate_x_dps: {checks: [{type: limit, red_low: -5.0, yellow_low: -2.0, yellow_high: 2.0, red_high: 5.0}]}
  rate_y_dps: {checks: [{type: limit, red_low: -5.0, yellow_low: -2.0, yellow_high: 2.0, red_high: 5.0}]}
  rate_z_dps: {checks: [{type: limit, red_low: -5.0, yellow_low: -2.0, yellow_high: 2.0, red_high: 5.0}]}

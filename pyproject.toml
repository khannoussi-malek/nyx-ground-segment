[project]
name = "gs"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.162.6",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "minio==7.2.20",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.9",
    "pyarrow==26.0.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "uvicorn==0.54.0",
]

[project.scripts]
gs-migrate = "gs.common.migrate:main"
gs-sim = "gs.simulator.main:main"
gs-ingest = "gs.ingest.main:main"
gs-api = "gs.api.server:main"
gs-archiver = "gs.archiver.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs", "graphify-out", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE001", "S110", "FIX"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["FIX"]

[tool.ruff.lint.isort]
# the git-ignored redis/ dir (generated users.acl) made ruff call redis first-party locally only
known-third-party = ["redis"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]  # no stubs, no py.typed
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/meta"]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20261113",
]

[tool.uv]
# P-pf41: a package newly added to uv.lock must be at least 14 days old, transitive ones too
# (checked 2026-11-15). Newest releases that old:
constraint-dependencies = [
    "argon2-cffi-bindings==26.1.0",  # 26.2.0 is from 2026-11-13; 26.1.0 from 2026-08-20
    "pycryptodome==4.2.0",           # 4.4.0 is from 2026-11-07; 4.2.0 from 2026-10-24
]

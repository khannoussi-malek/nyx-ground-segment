[project]
name = "gs"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.162.6",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "minio==7.2.20",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.9",
    "pyarrow==26.0.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "uvicorn==0.54.0",
]

[project.scripts]
gs-migrate = "gs.common.migrate:main"
gs-sim = "gs.simulator.cli:main"
gs-ingest = "gs.ingest.main:main"
gs-api = "gs.api.server:main"
gs-archiver = "gs.archiver.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs", "graphify-out", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE001", "S", "C901", "FIX"]
# S101: every assert outside tests narrows a type for mypy or states an internal invariant
# (none validates input; input is validated by pydantic and the command checks); the two
# autocommit guards in archiver/job.py are explicit raises, not asserts
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 15  # NPR 7150.2D SWE-135 complexity metric; 15 is the proposed ceiling, not agreed (the 10 default flags 12 working functions)

[tool.ruff.lint.per-file-ignores]
# tests: assert is the test idiom (S101); fixed-argument docker/redis-cli calls, seeded random
# data, test-only credentials and SQL built from test-owned table names are not attack surface
"tests/**" = ["FIX", "S104", "S105", "S106", "S310", "S311", "S603", "S607", "S608"]
# developer tools: git/docker/uv run with fixed argument lists (S603, S607), urlopen only on the
# local stack's http URLs (S310), seeded load-shape randomness (S311), table names from constants (S608)
"scripts/**" = ["S603", "S607", "S608"]
"perf/**" = ["S310", "S311", "S603", "S607"]

[tool.ruff.lint.isort]
# the git-ignored redis/ dir (generated users.acl) made ruff call redis first-party locally only
known-third-party = ["redis"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]  # no stubs, no py.typed
ignore_missing_imports = true

[tool.coverage.run]
branch = true  # statement and decision coverage (ECSS-E-ST-40C 5.8.3.5, R25 F2)

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/meta", "tests/property"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib -m 'not spike and not after_coverage'"  # on demand: pytest -m spike / -m after_coverage
markers = [
    "spike: exploratory tool trial, not part of the gate",
    "after_coverage: needs coverage.json from the coverage run; gate on from Task 24 (D-ENG-21)",
]
pythonpath = ["."]

[dependency-groups]
dev = [
    "cyclonedx-bom==8.0.1",  # SBOM per tag (sbom.yml); 8.0.1 is from 2026-11-04, 9.0.0 from 2026-11-19
    "hypothesis-jsonschema==0.23.2",  # 0.23.2 is from 2026-10-27 (P7, D-EXT-14)
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "pip-audit==2.10.1",  # dependency vulnerability scan (CI lint job)
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "schemathesis==4.32.7",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20261113",
]

[tool.uv]
# P-pf41 (2026-11-15): packages newly added to uv.lock must be at least 14 days old, transitive
# ones too. Each younger release is held to its newest older release.
constraint-dependencies = [
    "graphql-core<3.3.2",   # 3.3.2 is from 2026-11-06; 3.3.1 is from 2026-10-25
    "hypothesis<6.170.15",  # 6.170.15 is from 2026-11-07; 6.170.14 is from 2026-10-30
    "markdown-it-py<4.3.0", # 4.3.0 is from 2026-11-11; 4.2.0 is from 2026-05-07
    "argon2-cffi-bindings==26.1.0",  # 26.2.0 is from 2026-11-13; 26.1.0 from 2026-08-20
    "pycryptodome==4.2.0",           # 4.4.0 is from 2026-11-07; 4.2.0 from 2026-10-24
    "cachecontrol<0.15.0",  # 0.15.0 is from 2026-11-16; 0.14.4 from 2025-11-14
    "filelock<4.2.10",      # 4.2.10+ are from 2026-11-07 or later; 4.2.9 is from 2026-11-04
    "jsonpointer<3.11",     # 3.11+ is from 2026-11-07 or later; 3.10 is from 2026-11-06
    "platformdirs<4.14.6",  # 4.14.6+ is from 2026-11-07 or later; 4.14.5 is from 2026-11-04
]
